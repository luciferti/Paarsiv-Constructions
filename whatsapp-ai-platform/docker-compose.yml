version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wa_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/wa_platform?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3100}
      PORT: "4000"
      NODE_ENV: production
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ./web-next
    environment:
      API_URL: http://api:4000
    depends_on:
      - api
    ports:
      - "3100:3100"

volumes:
  pgdata:
  uploads:
